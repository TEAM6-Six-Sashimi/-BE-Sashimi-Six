spring:
  datasource:
    url: jdbc:mysql://localhost:3306/sixsashimi_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: sashimi
    password: sashimi
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    encoding: UTF-8

  jpa:
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  profiles:
    active: gemini

  data:
    redis:
      host: localhost
      port: 6379

## key 확인 후 수정 예정
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-2.0-flash
  base-url: https://generativelanguage.googleapis.com/v1beta
  timeout-seconds: 30

jwt:
  secret: this-is-sashimi-lms-jwt-secret-key-for-hs256-authentication
  access-token-validity-in-milliseconds: 10800000
  refresh-token-validity-in-milliseconds: 1209600000

clova:
  ocr:
    secret-key: ${CLOVA_OCR_SECRET_KEY:}
    invoke-url: ${CLOVA_OCR_INVOKE_URL:}

---
spring:
  config:
    activate:
      on-profile: mailgun

  mail:
    host: smtp.mailgun.org
    port: 587
    username: ${MAILGUN_SMTP_USERNAME}
    password: ${MAILGUN_SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  mail:
    from: ${MAIL_FROM}