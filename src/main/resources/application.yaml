spring:
  datasource:
    url: jdbc:mysql://localhost:3306/sixsashimi_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: sashimi
    password: sashimi
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      ## 개발 시 never / PR 시 always
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  jpa:
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  profiles:
    active: local

## key 확인 후 수정 예정
openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-5-mini
  timeout-seconds: 30
jwt:
  secret: this-is-sashimi-lms-jwt-secret-key-for-hs256-authentication
  access-token-validity-in-milliseconds: 3600000
  refresh-token-validity-in-milliseconds: 1209600000

---
spring:
  config:
    activate:
      on-profile: mailgun

  mail:
    host: smtp.mailgun.org
    port: 587
    username: ${MAILGUN_SMTP_USERNAME}
    password: ${MAILGUN_SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  mail:
    from: ${MAIL_FROM}

