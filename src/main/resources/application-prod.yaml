spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  mail:
    host: smtp.mailgun.org
    port: 587
    username: ${MAILGUN_SMTP_USERNAME}
    password: ${MAILGUN_SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  secret: ${JWT_SECRET}

gemini:
  api-key: ${GEMINI_API_KEY}

clova:
  ocr:
    secret-key: ${CLOVA_OCR_SECRET_KEY}
    invoke-url: ${CLOVA_OCR_INVOKE_URL}

app:
  mail:
    from: ${MAIL_FROM}

file:
  upload-dir: ${FILE_UPLOAD_DIR:/app/uploads}
  base-url: ${FILE_BASE_URL:http://localhost:8080}

aws:
  access-key-id: ${AWS_ACCESS_KEY_ID}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY}
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket-images: ${S3_BUCKET_IMAGES:sashimi-images}
    bucket-videos: ${S3_BUCKET_VIDEOS:sashimi-videos}
    bucket-attachments: ${S3_BUCKET_ATTACHMENTS:sashimi-attachments}
    bucket-docs: ${S3_BUCKET_DOCS:sashimi-docs}
  cloudfront:
    images-domain: ${CLOUDFRONT_IMAGES_DOMAIN}
    videos-domain: ${CLOUDFRONT_VIDEOS_DOMAIN}

codef:
  client-id: ${CODEF_CLIENT_ID}
  client-secret: ${CODEF_CLIENT_SECRET}
  public-key: ${CODEF_PUBLIC_KEY}
