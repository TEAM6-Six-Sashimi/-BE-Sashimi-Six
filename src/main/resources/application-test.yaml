spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  flyway:
    enabled: false

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: test-secret-key-for-junit-test-environment-only

gemini:
  api-key: test-api-key

clova:
  ocr:
    secret-key: test-key
    invoke-url: http://localhost/mock-ocr

app:
  mail:
    from: test@sashimi.com
