spring:
  datasource:
    url: jdbc:mysql://localhost:3306/sixsashimi_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: sashimi
    password: sashimi
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: smtp.mailgun.org
    port: 587
    username: ${MAILGUN_SMTP_USERNAME:}
    password: ${MAILGUN_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  secret: this-is-sashimi-lms-jwt-secret-key-for-hs256-authentication

gemini:
  api-key: ${GEMINI_API_KEY:}

clova:
  ocr:
    secret-key: ${CLOVA_OCR_SECRET_KEY}
    invoke-url: ${CLOVA_OCR_INVOKE_URL}

app:
  mail:
    from: ${MAIL_FROM:no-reply@mg.market-app.org}

file:
  upload-dir: uploads/
  base-url: http://localhost:8080

toss:
  payments:
    secret-key: ${TOSS_PAYMENTS_SECRET_KEY:}

external:
  ncs:
    service-key: ${NCS_SERVICE_KEY}