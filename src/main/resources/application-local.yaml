spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/sixsashimi_dev?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: admin
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      connection-timeout: 5000
  flyway:
    repair-on-migrate: true
  jpa:
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: smtp.mailgun.org
    port: 587
    username: ${MAILGUN_SMTP_USERNAME:}
    password: ${MAILGUN_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  secret: this-is-sashimi-lms-jwt-secret-key-for-hs256-authentication

gemini:
  base-url: https://generativelanguage.googleapis.com/v1beta
  api-key: ${GEMINI_API_KEY}
  model: ${GEMINI_MODEL:gemini-3.5-flash}
  timeout-seconds: 30
clova:
  ocr:
    secret-key: ${CLOVA_OCR_SECRET_KEY}
    invoke-url: ${CLOVA_OCR_INVOKE_URL}

app:
  mail:
    from: ${MAIL_FROM:no-reply@mg.market-app.org}

file:
  upload-dir: uploads/
  base-url: http://localhost:8080

grafana:
  url: http://localhost:3000

prometheus:
  url: http://localhost:9090

aws:
  access-key-id: ${AWS_ACCESS_KEY_ID:}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket-images: ${S3_BUCKET_IMAGES:sashimi-images}
    bucket-videos: ${S3_BUCKET_VIDEOS:sashimi-videos}
    bucket-attachments: ${S3_BUCKET_ATTACHMENTS:sashimi-attachments}
    bucket-docs: ${S3_BUCKET_DOCS:sashimi-docs}
  cloudfront:
    images-domain: ${CLOUDFRONT_IMAGES_DOMAIN:}
    videos-domain: ${CLOUDFRONT_VIDEOS_DOMAIN:}

toss:
  payments:
    secret-key: ${TOSS_PAYMENTS_SECRET_KEY:}

external:
  ncs:
    service-key: ${NCS_SERVICE_KEY:}
  qualification-exam-schedule:
    service-key: ${QUALIFICATION_EXAM_SERVICE_KEY:}
  qualification-code:
    service-key: ${QUALIFICATION_CODE_SERVICE_KEY:}
  ai-server:
    base-url: http://172.31.33.226:8001
    timeout-seconds: 60

codef:
  client-id: ${CODEF_CLIENT_ID:}
  client-secret: ${CODEF_CLIENT_SECRET:}
  public-key: ${CODEF_PUBLIC_KEY:}