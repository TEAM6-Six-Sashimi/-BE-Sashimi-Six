name: Deploy Backend

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  build-check:
    name: Build check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build boot jar
        run: ./gradlew clean bootJar --no-daemon -x test

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-check

    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_APP_DIR: /home/ubuntu/-BE-Sashimi-Six
      EC2_ENV_FILE: /home/ubuntu/sashimi.env
      DOCKER_NETWORK: sashimi-net
      DOCKER_IMAGE: sashimi-six:latest
      DOCKER_CONTAINER: sashimi
      DEPLOY_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Configure SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          test -n "$EC2_HOST"
          test -n "$EC2_USER"
          test -n "$EC2_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/sashimi-ec2.pem
          chmod 600 ~/.ssh/sashimi-ec2.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy application
        run: |
          ssh -i ~/.ssh/sashimi-ec2.pem "$EC2_USER@$EC2_HOST" \
            "APP_DIR='$EC2_APP_DIR' ENV_FILE='$EC2_ENV_FILE' DOCKER_NETWORK='$DOCKER_NETWORK' DOCKER_IMAGE='$DOCKER_IMAGE' DOCKER_CONTAINER='$DOCKER_CONTAINER' DEPLOY_BRANCH='$DEPLOY_BRANCH' bash -s" <<'REMOTE'
          set -euo pipefail

          if [ ! -f "$ENV_FILE" ]; then
            echo "Missing env file: $ENV_FILE" >&2
            exit 1
          fi

          if grep -q 'CHANGE_ME' "$ENV_FILE"; then
            echo "Unfilled CHANGE_ME value exists in $ENV_FILE" >&2
            exit 1
          fi

          cd "$APP_DIR"
          git fetch origin "$DEPLOY_BRANCH"
          git checkout -B "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"

          sudo docker network inspect "$DOCKER_NETWORK" >/dev/null 2>&1 \
            || sudo docker network create "$DOCKER_NETWORK"

          if sudo docker ps --format '{{.Names}}' | grep -qx 'sashimi-redis'; then
            sudo docker network connect "$DOCKER_NETWORK" sashimi-redis >/dev/null 2>&1 || true
          fi

          # 앱 로그 공유 볼륨 없으면 생성
          sudo docker volume inspect sashimi-logs >/dev/null 2>&1 \
            || sudo docker volume create sashimi-logs

          # 이전 빌드의 dangling 이미지 정리 (실행 중인 이미지는 보존)
          sudo docker image prune -f

          sudo docker build -t "$DOCKER_IMAGE" .
          sudo docker rm -f "$DOCKER_CONTAINER" >/dev/null 2>&1 || true
          sudo docker run -d \
            --name "$DOCKER_CONTAINER" \
            --network "$DOCKER_NETWORK" \
            --restart unless-stopped \
            --env-file "$ENV_FILE" \
            -p 8080:8080 \
            -v sashimi-logs:/app/logs \
            "$DOCKER_IMAGE"

          for attempt in $(seq 1 30); do
            if sudo docker exec "$DOCKER_CONTAINER" wget -qO- http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend health check passed."
              # 빌드 캐시 정리 (레이어 캐시는 유지, 미사용 캐시만 제거)
              sudo docker builder prune -f
              exit 0
            fi
            sleep 5
          done

          echo "Backend health check failed." >&2
          sudo docker logs --tail 200 "$DOCKER_CONTAINER" >&2
          exit 1
          REMOTE

      - name: Create Grafana deploy annotation
        if: success()
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_API_TOKEN: ${{ secrets.GRAFANA_API_TOKEN }}
        run: |
          if [ -z "${GRAFANA_URL:-}" ] || [ -z "${GRAFANA_API_TOKEN:-}" ]; then
            echo "GRAFANA_URL/GRAFANA_API_TOKEN secret이 없어 annotation 등록을 건너뜁니다."
            exit 0
          fi
          curl -sf -X POST "$GRAFANA_URL/api/annotations" \
            -H "Authorization: Bearer $GRAFANA_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(printf '{"text": "배포: %s (%s)", "tags": ["deploy", "sashimi"]}' "${GITHUB_SHA:0:7}" "$GITHUB_ACTOR")" \
            || echo "Grafana annotation 등록 실패 (배포 자체는 정상 완료됨)"
