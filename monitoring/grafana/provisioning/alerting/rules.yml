apiVersion: 1

groups:
  - orgId: 1
    name: sashimi-critical
    folder: Sashimi Alerts
    interval: 1m
    rules:
      - uid: sashimi-app-down
        title: "[CRITICAL] 서버 다운"
        condition: C
        for: 1m
        noDataState: OK
        labels:
          severity: critical
        annotations:
          summary: "sashimi 서버가 응답하지 않습니다 (up == 0)."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'up{job="sashimi"}'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      - uid: sashimi-5xx-spike
        title: "[CRITICAL] 5xx 에러율 급증"
        condition: C
        for: 2m
        noDataState: OK
        labels:
          severity: critical
        annotations:
          summary: "최근 5분간 5xx 에러 비율이 5%를 초과했습니다."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: '(sum(rate(http_server_requests_seconds_count{job="sashimi", outcome="SERVER_ERROR"}[5m])) or vector(0)) / (sum(rate(http_server_requests_seconds_count{job="sashimi"}[5m])) or vector(1)) * 100'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [5] }
              refId: C

      - uid: sashimi-db-pool-pending
        title: "[CRITICAL] DB 커넥션 풀 고갈"
        condition: C
        for: 3m
        noDataState: OK
        labels:
          severity: critical
        annotations:
          summary: "DB 커넥션 풀이 고갈되어 요청이 대기 중입니다 (hikaricp_connections_pending > 0)."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'sum(hikaricp_connections_pending{job="sashimi"})'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      - uid: sashimi-db-timeout
        title: "[CRITICAL] DB 커넥션 타임아웃"
        condition: C
        for: 3m
        noDataState: OK
        labels:
          severity: critical
        annotations:
          summary: "최근 5분간 DB 커넥션 타임아웃이 발생했습니다."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'sum(increase(hikaricp_connections_timeout_total{job="sashimi"}[5m])) or vector(0)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

  - orgId: 1
    name: sashimi-infra
    folder: Sashimi Alerts
    interval: 1m
    rules:
      - uid: sashimi-host-cpu-high
        title: "[CRITICAL] 서버 CPU 사용률 높음"
        condition: C
        for: 3m
        noDataState: OK
        labels:
          severity: critical
        annotations:
          summary: "EC2 호스트 CPU 사용률이 85%를 초과한 상태가 3분 이상 지속되고 있습니다."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: '100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [85] }
              refId: C

      - uid: sashimi-host-memory-low
        title: "[CRITICAL] 서버 메모리 부족"
        condition: C
        for: 2m
        noDataState: OK
        labels:
          severity: critical
        annotations:
          summary: "EC2 호스트 가용 메모리가 15% 미만으로 떨어졌습니다 (OOM 위험)."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: '(node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [15] }
              refId: C

  - orgId: 1
    name: sashimi-security
    folder: Sashimi Alerts
    interval: 1m
    rules:
      - uid: sashimi-login-failure-spike
        title: "[WARNING] 로그인 실패율 급증 (스프레이 공격 의심)"
        condition: D
        for: 2m
        noDataState: OK
        labels:
          severity: warning
        annotations:
          summary: "최근 5분 로그인 실패 건수가 1시간 평균 대비 3배 이상, 절대치 10건 이상입니다."
        data:
          - refId: A
            relativeTimeRange: { from: 3900, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'sum(increase(auth_login_failed_total{job="sashimi"}[5m])) or vector(0)'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 3900, to: 0 }
            datasourceUid: prometheus
            model:
              expr: '(sum(increase(auth_login_failed_total{job="sashimi"}[1h] offset 5m)) or vector(0)) / 12'
              instant: true
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: math
              expression: '$A >= 10 && $A >= $B * 3'
              refId: C
          - refId: D
            datasourceUid: __expr__
            model:
              type: threshold
              expression: C
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: D
