global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'sashimi'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['172.31.35.185:8080']
    metrics_path: '/actuator/prometheus'

  - job_name: 'node'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['172.31.35.185:9100']
